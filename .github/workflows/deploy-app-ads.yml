name: Deploy app-ads.txt

on:
  push:
    branches:
      - main
    paths:
      - "hosting/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-app-ads.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAPTOBEAT_CD62F }}
          projectId: taptobeat-cd62f
          channelId: live
